name: Synthetic Traffic Looper

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: synthetic-traffic-looper
  cancel-in-progress: false

jobs:
  run-synthetic-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Journeys in a Loop (6 Hours)
        env:
          TARGET_SHOP_URL: https://aceso-target-shop.vercel.app/
        run: |
          mkdir -p results
          for i in {1..35}; do
            echo "Starting loop $i/35 at $(date)"
            npm run test:e2e || echo "Playwright run finished with exit code $? (logged)."
            
            # Archive individual run report
            if [ -f test-results.json ]; then
              cp test-results.json "results/run-$(printf "%02d" $i).json"
            fi
            
            if [ $i -lt 35 ]; then
              echo "Finished loop $i. Sleeping for 10 minutes..."
              sleep 600
            fi
          done

      - name: Upload Synthetic Traffic Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-traffic-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            test-results.json
            playwright-report/
            test-results/
          retention-days: 14
