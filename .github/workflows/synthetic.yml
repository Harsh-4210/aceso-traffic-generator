name: Synthetic User Traffic Cron

on:
  schedule:
    # Offset minutes to avoid top-of-the-hour GitHub Actions congestion
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  run-synthetic-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Journeys
        env:
          TARGET_SHOP_URL: https://aceso-target-shop.vercel.app/
        run: npm run test:e2e


# Force re-registration of cron trigger

